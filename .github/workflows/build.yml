name: MSBuild

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.GITHUB_TOKEN}} 
          
      - name: Set the value
        run: |
            echo "VERSION_FILENAME=3_25_${env:BUILD_NUMBER}_0" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "VERSION_DOT_FILENAME=3.25.${env:BUILD_NUMBER}.0" | Out-File -FilePath $env:GITHUB_ENV -Append
            
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup vcpkg (manifest mode provides zlib/libpng/tinyxml2)
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          if (Get-Command vcpkg -ErrorAction SilentlyContinue) {
            vcpkg --version
            # Fetch the pinned baseline into every vcpkg checkout CI may use
            # (msbuild restores via $env:VCPKG_ROOT, cl steps via PATH vcpkg).
            # Runner checkouts can predate it and fail manifest restore.
            $roots = @()
            $roots += Split-Path ((Get-Command vcpkg).Source) -Parent
            if ($env:VCPKG_ROOT) { $roots += $env:VCPKG_ROOT }
            foreach ($r in ($roots | Select-Object -Unique)) {
              $gitDir = Join-Path $r '.git'
              if (Test-Path $gitDir) {
                if (Test-Path (Join-Path $gitDir 'shallow')) { git -C $r fetch --unshallow --tags }
                else { git -C $r fetch --tags }
              }
            }
          } else {
            git clone https://github.com/microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
            # Wire the fresh clone into MSBuild so manifest restore works
            .\vcpkg\vcpkg.exe integrate install
          }

      - name: Setup MSVC
        # v1.13.0, pinned by SHA so a tag rewrite cannot change what CI runs
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Restore vcpkg deps for xml parity test
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: |
          if (Get-Command vcpkg -ErrorAction SilentlyContinue) {
            # Fetch the pinned baseline: runner checkouts can predate it and
            # fail manifest restore with "failed to `git show` versions/baseline.json".
            $vcpkgRoot = Split-Path ((Get-Command vcpkg).Source) -Parent
            $gitDir = Join-Path $vcpkgRoot '.git'
            if (Test-Path $gitDir) {
              if (Test-Path (Join-Path $gitDir 'shallow')) { git -C $vcpkgRoot fetch --unshallow --tags }
              else { git -C $vcpkgRoot fetch --tags }
            }
            vcpkg install --triplet x64-windows
          } else {
            git clone https://github.com/microsoft/vcpkg.git
            .\vcpkg\bootstrap-vcpkg.bat
            .\vcpkg\vcpkg.exe install --triplet x64-windows
          }

      - name: Build theme colour tests
        run: cl /nologo /std:c++17 /W4 /EHsc /I src tests\test_theme_colors.cpp /Fe:test_theme_colors.exe

      - name: Run tests
        run: .\test_theme_colors.exe

      - name: Build list query builder tests
        run: cl /nologo /std:c++17 /W4 /EHsc /I src tests\test_list_query_builder.cpp /Fe:test_list_query_builder.exe

      - name: Run list query builder tests
        run: .\test_list_query_builder.exe

      - name: Build clip row flag tests
        run: cl /nologo /std:c++17 /W4 /EHsc /I src tests\test_clip_row_flags.cpp /Fe:test_clip_row_flags.exe

      - name: Run clip row flag tests
        run: .\test_clip_row_flags.exe

      - name: Build list layout math tests
        run: cl /nologo /std:c++17 /W4 /EHsc /I src tests\test_list_layout_math.cpp /Fe:test_list_layout_math.exe

      - name: Run list layout math tests
        run: .\test_list_layout_math.exe

      - name: Build xml file load tests
        run: cl /nologo /std:c++17 /W4 /EHsc /I src tests\test_xml_file_load.cpp /Fe:test_xml_file_load.exe

      - name: Run xml file load tests
        run: .\test_xml_file_load.exe

      - name: Build xml parity tests
        run: cl /nologo /std:c++17 /W4 /EHsc /I src /I vcpkg_installed\x64-windows\include tests\test_xml_parity.cpp /Fe:test_xml_parity.exe /link vcpkg_installed\x64-windows\lib\tinyxml2.lib

      - name: Run xml parity tests
        run: |
          copy vcpkg_installed\x64-windows\bin\tinyxml2.dll .
          New-Item -ItemType Directory -Force test_parity_out | Out-Null
          .\test_xml_parity.exe Debug\Language Debug\Themes test_parity_out
        
      - name: Build
        run: msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64
        
      - name: Set Versions
        run: |
            DittoSetup\rcedit-x64 Release64\Ditto.exe --set-file-version ${{env.VERSION_DOT_FILENAME}} --set-product-version ${{env.VERSION_DOT_FILENAME}}

      - name: Check signing availability
        id: check_signing
        run: |
            if ([string]::IsNullOrWhiteSpace('${{ secrets.SIGNPATH_API_TOKEN }}')) {
                echo "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                echo "Signing is NOT available - will build unsigned installer and portable"
            } else {
                echo "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                echo "Signing is available - will run full release pipeline"
            }

      - name: upload-unsigned-exe
        id: upload-unsigned-exe
        if: steps.check_signing.outputs.available == 'true'
        # NOTE: upload-only in this repo (no download-artifact step); keep upload-artifact
        # major version consistent if a download side is ever added (v6 download requires v6 upload).
        uses: actions/upload-artifact@v6
        with: 
          name: unsigned-exe
          retention-days: 1
          path: |
            Release64\Ditto.exe
            Release64\ICU_Loader.dll
            Release64\Addins\DittoUtil.dll
            
      - id: sign-exe
        if: steps.check_signing.outputs.available == 'true'
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: 'fcf33ea4-4343-46b3-be50-f8fe64e1a900'
          project-slug: 'Ditto'
          artifact-configuration-slug: 'exe'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-exe.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '/Release64'      
                   
      - name: Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: DittoSetup\DittoSetup_10.iss
          
      - name: upload-unsigned-artifact
        id: upload-unsigned-artifact
        if: steps.check_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with: 
          name: unsigned-intaller
          retention-days: 1
          path: DittoSetup\output\DittoSetup_${{env.VERSION_FILENAME}}.exe
          
      - id: sing-installer
        if: steps.check_signing.outputs.available == 'true'
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: 'fcf33ea4-4343-46b3-be50-f8fe64e1a900'
          project-slug: 'Ditto'
          artifact-configuration-slug: 'Installer'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '/DittoSetup/output'          
          
      - name: Build Portable
        run: |
            DittoSetup\BuildPortableZIP.bat "DittoPortable_${{env.VERSION_FILENAME}}" bit64
            
      - name: Zip Debug Files
        run: |
            7z a DittoSetup\output\DittoDebug_${{env.VERSION_FILENAME}}.7z *.pdb -r
            7z a DittoSetup\output\DittoDebug_${{env.VERSION_FILENAME}}.7z *.map -r
            
      - name: Choco - Ditto
        if: steps.check_signing.outputs.available == 'true'
        run: |
            (Get-Content 'DittoSetup\Chocolatey\ditto.nuspec' -Raw).Replace("%version%", "${{env.VERSION_DOT_FILENAME}}") | Out-File 'DittoSetup\Chocolatey\ditto.nuspec'
            copy DittoSetup\Output\DittoSetup_${{env.VERSION_FILENAME}}.exe DittoSetup\Chocolatey\tools\DittoSetup_${{env.VERSION_FILENAME}}.exe
            cd DittoSetup\Chocolatey
            choco pack     
            choco push --source https://push.chocolatey.org/ --key ${{ secrets.CHOCO_API_KEY}}
            cd ..
            cd ..
            
      - name: Choco - Ditto.Install
        if: steps.check_signing.outputs.available == 'true'
        run: |
            (Get-Content 'DittoSetup\Chocolatey.install\ditto.nuspec' -Raw).Replace("%version%", "${{env.VERSION_DOT_FILENAME}}") | Out-File 'DittoSetup\Chocolatey.install\ditto.nuspec'
            copy DittoSetup\output\DittoSetup_${{env.VERSION_FILENAME}}.exe DittoSetup\Chocolatey.install\tools\DittoSetup_${{env.VERSION_FILENAME}}.exe
            cd DittoSetup\Chocolatey.install
            choco pack     
            choco push --source https://push.chocolatey.org/ --key ${{ secrets.CHOCO_API_KEY}}
            cd ..
            cd ..
    
      - name: Choco - Ditto.Portable
        if: steps.check_signing.outputs.available == 'true'
        run: |
            (Get-Content 'DittoSetup\Chocolatey.portable\ditto.nuspec' -Raw).Replace("%version%", "${{env.VERSION_DOT_FILENAME}}") | Out-File 'DittoSetup\Chocolatey.portable\ditto.nuspec'
            copy DittoSetup\output\DittoPortable_${{env.VERSION_FILENAME}}.zip DittoSetup\Chocolatey.portable\tools\DittoPortable_${{env.VERSION_FILENAME}}.zip
            cd DittoSetup\Chocolatey.portable
            choco pack     
            choco push --source https://push.chocolatey.org/ --key ${{ secrets.CHOCO_API_KEY}}
            cd ..
            cd ..
            
      - name: Build appx
        if: steps.check_signing.outputs.available == 'true'
        run: |
            7z x DittoSetup\output\DittoPortable_${{env.VERSION_FILENAME}}.zip -oDittoSetup\appx -r
            (Get-Content 'DittoSetup\appx\appxmanifest.xml' -Raw).Replace("%version%", "${{env.VERSION_DOT_FILENAME}}") | Out-File 'DittoSetup\appx\appxmanifest.xml'  
            cd DittoSetup\appx

            $env:Path += ";C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x86"
        
            makeappx.exe pack /f files.ini /p Ditto_${{env.VERSION_FILENAME}}.appx
            signtool.exe sign -f my.pfx -fd SHA256 -v Ditto_${{env.VERSION_FILENAME}}.appx
            cd ..
            cd ..
            copy DittoSetup\appx\Ditto_${{env.VERSION_FILENAME}}.appx DittoSetup\Output\Ditto_${{env.VERSION_FILENAME}}.appx
    
      - name: Publish to GitHub
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          token: ${{secrets.GITHUB_TOKEN}}
          uploadPath: DittoSetup\output\
          tag: v${{env.VERSION_DOT_FILENAME}}
          previous_tag: v3.25.113.0
        run: |
             npm install ./DittoSetup/GitHubRelease
             node ./DittoSetup/GitHubRelease/index.js

      - name: Upload unsigned build artifacts
        if: steps.check_signing.outputs.available != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-build-${{env.VERSION_FILENAME}}
          retention-days: 7
          path: |
            Release64\Ditto.exe
            Release64\ICU_Loader.dll
            Release64\Addins\DittoUtil.dll
            DittoSetup\output\DittoSetup_${{env.VERSION_FILENAME}}.exe
            DittoSetup\output\DittoPortable_${{env.VERSION_FILENAME}}.zip
            DittoSetup\output\DittoDebug_${{env.VERSION_FILENAME}}.7z
